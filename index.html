<html>
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>


    <!-- =========================
         COMPONENTE AUTO-FIT
         Mide el modelo cuando carga, lo escala para que
         su lado más grande mida "size" y lo centra sobre
         el target. Así no importa qué tan grande o chico
         venga el .glb desde Blender.
         (1 unidad = el ancho de la imagen del target)
    ========================== -->

    <script>

      AFRAME.registerComponent("auto-fit", {

        schema: {
          size: { type: "number", default: 1 }
        },

        init: function () {

          // Cuando el modelo termina de cargar, lo ajustamos
          this.el.addEventListener("model-loaded", () => this.fit());

        },

        update: function () {

          // Si cambias "size", se vuelve a ajustar
          this.fit();

        },

        fit: function () {

          const THREE = AFRAME.THREE;

          const obj = this.el.getObject3D("mesh");

          // Si el modelo todavía no carga, no hacemos nada
          if (!obj) return;


          // 1) Dejar el modelo en escala 1 y en el origen para medirlo
          obj.position.set(0, 0, 0);
          obj.scale.set(1, 1, 1);
          this.el.object3D.updateMatrixWorld(true);


          // 2) Medir la "caja" que envuelve todo el modelo,
          //    en el espacio local de esta entidad
          const entidadInversa = new THREE.Matrix4()
            .copy(this.el.object3D.matrixWorld)
            .invert();

          const caja = new THREE.Box3();

          obj.traverse((hijo) => {

            if (!hijo.isMesh || !hijo.geometry) return;

            if (!hijo.geometry.boundingBox) {
              hijo.geometry.computeBoundingBox();
            }

            const cajaHijo = hijo.geometry.boundingBox.clone();

            cajaHijo.applyMatrix4(
              new THREE.Matrix4().multiplyMatrices(
                entidadInversa,
                hijo.matrixWorld
              )
            );

            caja.union(cajaHijo);

          });

          if (caja.isEmpty()) return;


          // 3) Calcular el factor de escala
          const tamano = new THREE.Vector3();
          const centro = new THREE.Vector3();

          caja.getSize(tamano);
          caja.getCenter(centro);

          const ladoMayor = Math.max(tamano.x, tamano.y, tamano.z);

          if (!ladoMayor) return;

          const factor = this.data.size / ladoMayor;


          // 4) Aplicar escala y centrar el modelo
          obj.scale.setScalar(factor);

          obj.position.set(
            -centro.x * factor,
            -centro.y * factor,
            -centro.z * factor
          );

        }

      });

    </script>


    <!-- =========================
         FEEDBACK VISUAL
    ========================== -->

    <style>

      #mensaje {
        position: fixed;
        top: 20px;
        width: 100%;
        text-align: center;
        color: white;
        font-family: Arial;
        font-size: 25px;
        z-index: 9999;
        text-shadow: 2px 2px 5px black;
      }

    </style>

  </head>


  <body>


    <!-- =========================
         MENSAJE
    ========================== -->

    <div id="mensaje">
       ESCANEA UNA IMAGEN
    </div>


    <!--
      El archivo targets.mind tiene las 3 imágenes compiladas JUNTAS:
        target1 -> índice 0
        target2 -> índice 1
        target3 -> índice 2

      Para cambiar el tamaño de un modelo, cambia el número de
      auto-fit="size: 1" (más grande = más grande el modelo).
      Para moverlo, agrega position="x y z" al modelo.
    -->

    <a-scene

      mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 3"

      color-space="sRGB"

      renderer="colorManagement: true, physicallyCorrectLights"

      vr-mode-ui="enabled: false"

      device-orientation-permission-ui="enabled: false">


      <!-- =========================
           MODELOS
      ========================== -->

      <a-assets>

        <a-asset-item
          id="MacdonaldModel" src="./macdonald.glb">
        </a-asset-item>

        <a-asset-item
          id="SillyCatModel" src="./silly_cat_sculpt_test_unrigged.glb">
        </a-asset-item>

        <a-asset-item
          id="CatPlushModel" src="./cat_plush_no_texture.glb">
        </a-asset-item>

      </a-assets>


      <!--  CÁMARA -->

      <a-camera
        position="0 0 0"
        look-controls="enabled: false"
        cursor="rayOrigin: mouse; fuse: false"
        raycaster="objects: .clickable; far: 10000">
      </a-camera>


      <!-- ==================================================
           TARGET 1 - empieza con MACDONALD
      ================================================== -->

      <a-entity
        id="target1"
        mindar-image-target="targetIndex: 0">


        <!-- MACDONALD -->

        <a-gltf-model
          class="clickable macdonald-model"
          src="#MacdonaldModel"
          auto-fit="size: 1"
          animation-mixer>
        </a-gltf-model>


        <!-- SILLY CAT -->

        <a-gltf-model
          class="silly-cat-model"
          src="#SillyCatModel"
          auto-fit="size: 1"
          visible="false"
          animation-mixer>
        </a-gltf-model>


        <!-- CAT PLUSH -->

        <a-gltf-model
          class="cat-plush-model"
          src="#CatPlushModel"
          auto-fit="size: 1"
          visible="false"
          animation-mixer>
        </a-gltf-model>


      </a-entity>


      <!-- ==================================================
           TARGET 2 - empieza con SILLY CAT
      ================================================== -->

      <a-entity
        id="target2"
        mindar-image-target="targetIndex: 1">


        <!-- MACDONALD -->

        <a-gltf-model
          class="macdonald-model"
          src="#MacdonaldModel"
          auto-fit="size: 1"
          visible="false"
          animation-mixer>
        </a-gltf-model>


        <!-- SILLY CAT -->

        <a-gltf-model
          class="clickable silly-cat-model"
          src="#SillyCatModel"
          auto-fit="size: 1"
          animation-mixer>
        </a-gltf-model>


        <!-- CAT PLUSH -->

        <a-gltf-model
          class="cat-plush-model"
          src="#CatPlushModel"
          auto-fit="size: 1"
          visible="false"
          animation-mixer>
        </a-gltf-model>


      </a-entity>


      <!-- ==================================================
           TARGET 3 - empieza con CAT PLUSH
      ================================================== -->

      <a-entity
        id="target3"
        mindar-image-target="targetIndex: 2">


        <!-- MACDONALD -->

        <a-gltf-model
          class="macdonald-model"
          src="#MacdonaldModel"
          auto-fit="size: 1"
          visible="false"
          animation-mixer>
        </a-gltf-model>


        <!-- SILLY CAT -->

        <a-gltf-model
          class="silly-cat-model"
          src="#SillyCatModel"
          auto-fit="size: 1"
          visible="false"
          animation-mixer>
        </a-gltf-model>


        <!-- CAT PLUSH -->

        <a-gltf-model
          class="clickable cat-plush-model"
          src="#CatPlushModel"
          auto-fit="size: 1"
          animation-mixer>
        </a-gltf-model>


      </a-entity>


    </a-scene>


    <!-- =========================
         INTERACCIÓN + FEEDBACK
    ========================== -->

    <script>

      document.addEventListener("DOMContentLoaded", () => {


        const mensaje =
          document.querySelector("#mensaje");


        /*
         * =========================
         * FEEDBACK DE LOS TARGETS
         * =========================
         */

        document
          .querySelectorAll("[mindar-image-target]")
          .forEach((target) => {


            target.addEventListener(
              "targetFound",
              () => {

                mensaje.innerHTML =
                  "IMAGEN DETECTADA<br>TOCA EL MODELO PARA CAMBIARLO";

              }
            );


            target.addEventListener(
              "targetLost",
              () => {

                mensaje.innerHTML =
                  "ESCANEA UNA IMAGEN";

              }
            );


          });


        /*
         * =========================
         * CAMBIO DE MODELO
         * =========================
         */

        function cambiarModelo(modeloActual, siguienteModelo) {


          // Ocultar modelo actual

          modeloActual.setAttribute("visible", "false");


          // Quitarle la clase clickable

          modeloActual.classList.remove("clickable");


          // Mostrar siguiente modelo

          siguienteModelo.setAttribute("visible", "true");


          // Hacer que el siguiente modelo
          // pueda recibir el toque

          siguienteModelo.classList.add("clickable");


        }


        /*
         * =========================
         * FUNCIÓN PARA CONFIGURAR
         * LOS MODELOS DE CADA TARGET
         * =========================
         */

        function configurarTarget(target) {


          const modelos =
            target.querySelectorAll("a-gltf-model");


          modelos.forEach((modelo) => {


            modelo.addEventListener(
              "click",
              function() {


                /*
                 * Buscar cuál es el modelo
                 * que está visible ahora
                 * (el que tiene "clickable")
                 */

                let actual = -1;

                modelos.forEach((m, i) => {

                  if (m.classList.contains("clickable")) {

                    actual = i;

                  }

                });


                /*
                 * Siguiente modelo
                 * (el % hace que después del último
                 * vuelva al primero)
                 */

                let siguiente =
                  (actual + 1) % modelos.length;


                cambiarModelo(
                  modelos[actual],
                  modelos[siguiente]
                );


              }
            );


          });


        }


        /*
         * =========================
         * CONFIGURAR LOS 3 TARGETS
         * =========================
         */

        configurarTarget(document.querySelector("#target1"));

        configurarTarget(document.querySelector("#target2"));

        configurarTarget(document.querySelector("#target3"));


      });

    </script>


  </body>
</html>
